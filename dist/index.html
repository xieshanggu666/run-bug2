<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>河流声音地图 · 亲子互动装置</title>
    <script type="module" crossorigin src="./assets/index-sGWv8_aW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DAYurAZJ.css">
  </head>
  <body>
    <div id="hud">🎵 <span id="noteCount">0</span>/<span id="noteTotal">6</span></div>
    <button id="panelToggle" aria-label="家长面板">🎛️</button>

    <div id="panel" class="hidden">
      <div class="group">
        <label for="flow">🌊 水流速度</label>
        <input id="flow" type="range" min="0" max="100" value="40" />
      </div>
      <div class="group">
        <label for="level">💧 水位高低</label>
        <input id="level" type="range" min="0" max="100" value="50" />
      </div>
      <div class="group row">
        <button class="weather active" data-weather="sunny">☀️</button>
        <button class="weather" data-weather="rain">🌧️</button>
        <button class="weather" data-weather="wind">💨</button>
      </div>
      <div class="group row">
        <button id="mic">🎙️ 录一段声音</button>
        <button id="mute">🔊</button>
      </div>
      <p class="tip">
        孩子玩法：把河里的声波碎片拖进上面的圆圈，拼出河流的歌；调高水位，找找被淹没的
        ♪。录音需要麦克风权限。
      </p>
    </div>

    <div id="toast" role="status"></div>
    <div id="hint">把河里的声波碎片拖进上面的圆圈 ♪ 调节水位，寻找被淹没的音符</div>

  </body>
</html>
